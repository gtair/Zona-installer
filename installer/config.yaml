version: 1
# debug_console: reveals the console
# log_debug: writes Python DEBUG logger output to the log file.
debug_console: true
log_debug: false


choices:
  - id: install_zona
    label: "Install Zona"
    description: "Installs the Zona modpack and Mod Organizer 2 to your system."
    choices:
      - id: sss21
        label: "SSS21"
        description: "Higher performance, less visual quality. Performance increase is negligible, visual quality is much worse."
        choices:
          - id: bhs_hud
            label: "BHS HUD"
            description: "Traditional Tarkov-style HUD"

      - id: sss23
        label: "SSS23"
        description: "Higher visual quality, less performance. The default choice for most users"
        choices:
          - id: clean_hud
            label: "Medik Device Clean HUD"
            description: "places HUD on a special medical device"
          - id: bhs_hud
            label: "BHS HUD"
            description: "Traditional Tarkov-style HUD"

  - id: update_graphics
    label: "Update Graphics"
    description: "Updates the selected settings for an existing Zona installation."
    choices:
      - id: sss21
        label: "SSS21"
        description: "Higher performance, less visual quality. Performance increase is negligible, visual quality is much worse."
        choices:
          - id: bhs_hud
            label: "BHS HUD"
            description: "Traditional Tarkov-style HUD"

      - id: sss23
        label: "SSS23"
        description: "Higher visual quality, less performance. The default choice for most users"
        choices:
          - id: clean_hud
            label: "Medik Device Clean HUD"
            description: "places HUD on a special medical device"
          - id: bhs_hud
            label: "BHS HUD"
            description: "Traditional Tarkov-style HUD"

