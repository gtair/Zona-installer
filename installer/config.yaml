steps:
  - name: prepare_dirs
    action: create_dir
    choice: install_zona
    dir: ["downloads", "../anomaly", "../mo2"]

  - name: install_base_anomaly
    action: extract
    choice: install_zona
    file: "downloads/anomaly.7z"
    target: "../anomaly"

  - name: install_base_mo2
    action: extract
    choice: install_zona
    file: "downloads/mod_organizer.7z"
    target: "../mo2"

  - name: install_modded_exes
    action: extract
    choice: install_zona
    file: "downloads/modded_exes.zip"
    target: "../anomaly"

  - name: prompt_user_verify_game
    action: verify_game
    choice: install_zona
    # launches anomaly/bin/AnomalyDX11AVX.exe directly
    # user closes the game once they've confirmed the modded exe works, then continues

  - name: delete_shader_cache
    action: delete
    dir: "../anomaly/appdata/shaders_cache/r4"

  - name: install_zona
    action: extract
    choice: install_zona
    file: "downloads/zona_multipart.7z.001"
    target: "../mo2"

  - name: drop_in_profiles
    action: extract
    choice: update_graphics
    file: "downloads/zona_profiles.7z"
    target: "../mo2/profiles"


# SSS23 MO2 SETUP
  - name: setup_mo2_ini_sss23
    action: template_fill
    choice: sss23
    source: "downloads/ModOrganizer.ini.template"
    target: "../mo2/ModOrganizer.ini"
    replacements:
      PROFILE_NAME: "ZONA V1.38 SSS23.5 (High Graphics)"

  - name: delete_mo2_profile_sss21
    action: delete
    choice: sss23
    dir: ["../mo2/profiles/ZONA V1.38 SSS21 (Basic Graphics)", "../mo2/profiles/ZONA V1.38 (Potato)", "../mo2/profiles/Default"]


# SSS21 MO2 SETUP
  - name: setup_mo2_ini_sss21
    action: template_fill
    choice: sss21
    source: "downloads/ModOrganizer.ini.template"
    target: "../mo2/ModOrganizer.ini"
    replacements:
      PROFILE_NAME: "ZONA V1.38 SSS21 (Basic Graphics)"

  - name: delete_mo2_profile_sss23
    action: delete
    choice: sss21
    dir: ["../mo2/profiles/ZONA V1.38 SSS23.5 (High Graphics)", "../mo2/profiles/Default"]


  - name: setup_nxm_handler
    action: template_fill
    choice: install_zona
    source: "downloads/nxmhandler.ini.template"
    target: "../mo2/nxmhandler.ini"

  - name: install_selected_settings_bhs_hud
    action: extract
    choice: bhs_hud
    file: "downloads/bhs_hud.7z"
    target: "../anomaly"
    from: ["Bhs Hud"]

  - name: install_selected_settings_clean_hud
    action: extract
    choice: clean_hud
    file: "downloads/clean_hud.7z"
    target: "../anomaly"
    from: ["Clean Hud"]