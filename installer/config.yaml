version: 1
# debug_console: writes Python DEBUG logger output to the terminal console.
# show_7z_console: opens a separate 7z console window for the extractor.
# NOTE: these are intentionally mutually exclusive with live 7z progress parsing.
debug_console: true
show_7z_console: false

choices:
  - id: sss21
    label: "SSS21"
    description: "Higher performance, less visual quality. Performance increase is negligible, visual quality is much worse."
    choices:
      - id: bhs_hud
        label: "BHS HUD"
        description: "Traditional Tarkov-style HUD"

  - id: sss23
    label: "SSS23"
    description: "Higher visual quality, less performance. The default choice for most users"
    choices:
      - id: clean_hud
        label: "Clean HUD"
        description: "places HUD on PDA"
      - id: bhs_hud
        label: "BHS HUD"
        description: "Traditional Tarkov-style HUD"

