steps:
  - name: prepare_dirs
    action: create_dir
    dir: ["downloads", "../anomaly", "../mo2"]

  - name: install_base_anomaly
    action: extract
    file: "downloads/anomaly.7z"
    target: "../anomaly"

  - name: install_base_mo2
    action: extract
    file: "downloads/mod_organizer.7z"
    target: "../mo2"

  - name: install_modded_exes
    action: extract
    file: "downloads/modded_exes.zip"
    target: "../anomaly"

  - name: prompt_user_verify_game
    action: verify_game
    # launches anomaly/bin/AnomalyDX11AVX.exe directly (hardcoded in main.py, not through MO2)
    # user closes the game once they've confirmed the modded exe works, then continues

  - name: delete_shader_cache
    action: delete
    dir: "../anomaly/appdata/shaders_cache/r4"

  - name: install_zona
    action: extract
    file: "downloads/zona_multipart.7z.001"
    target: "../mo2"
    # multi-part archive - installer.py follows .002-.007 automatically from the first part

  - name: install_selected_settings
    action: extract
    target: "../anomaly"
    # no "file" here - installer.py extracts whichever downloaded assets match the user's selected choice ids
